name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --manifest-path cli/Cargo.toml --target "${{ matrix.target }}"
      - name: Package and checksum
        run: |
          cp "cli/target/${{ matrix.target }}/release/stegotrace" stegotrace
          tar -czf "stegotrace-${{ matrix.target }}.tar.gz" stegotrace
          shasum -a 256 "stegotrace-${{ matrix.target }}.tar.gz" > "stegotrace-${{ matrix.target }}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stegotrace-${{ matrix.target }}.tar.gz
            stegotrace-${{ matrix.target }}.tar.gz.sha256

