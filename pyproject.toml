[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stegotrace"
version = "0.1.1"
description = "Auditable steganalysis and safe payload extraction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Guillermo Zubikarai" }]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=11.0",
  "jpeglib>=1.0.2,<2",
  "scipy>=1.14",
]

[project.optional-dependencies]
api = ["fastapi>=0.116", "python-multipart>=0.0.20", "uvicorn[standard]>=0.35"]
dev = ["httpx>=0.28", "pytest>=8.4", "pytest-cov>=6.2", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/stegotrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM115"]
