[package]
name = "stegotrace"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Native macOS steganalysis and safe payload extraction"
repository = "https://github.com/stegotrace/stegotrace"

[[bin]]
name = "stegotrace"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.45", features = ["derive"] }
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
statrs = "0.19.0"
walkdir = "2.5.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
